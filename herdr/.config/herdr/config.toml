onboarding = false
[theme]
name = "dracula"
auto_switch = false

[theme.custom]
# Keep dracula colors but let the terminal's transparency show through the
# tab bar / panel surfaces (same effect the "terminal" theme has everywhere).
panel_bg = "reset"

[keys]
prefix = "ctrl+a"
focus_agent = "prefix+shift+1..9"
previous_agent = "prefix+shift+<"
next_agent = "prefix+shift+>"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "martinro.next-agent.jump"
description = "next agent needing attention"

[ui]
hide_tab_bar_when_single_tab = true
agent_panel_sort = "spaces"
status_indicators = "dots"
show_agent_labels_on_pane_borders = false

[advanced]
scrollback_limit_bytes = 10485760

[experimental]
kitty_graphics = true

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]
