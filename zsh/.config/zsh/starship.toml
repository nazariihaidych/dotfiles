# ~/.config/zsh/starship.toml
# Starship prompt configuration.
# Full reference: https://starship.rs/config/
# Requires a Nerd Font installed in your terminal — see SETUP.md.

# Use "$schema" to get IDE autocomplete when editing this file.
"$schema" = 'https://starship.rs/config-schema.json'

# Don't print a blank line before each prompt.
# Set to true if you prefer visual separation between commands.
add_newline = false

# =========================================================
# Prompt format
# =========================================================
# Defines the order and content of the prompt line.
# Each $module_name is replaced by the module's output (or empty string).
# Trailing space after $php separates the modules from the $character symbol.
format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"

# =========================================================
# OS module  — shows an icon for the current OS
# =========================================================
[os]
disabled = true  # set to true to hide the OS icon

# [$symbol] is the icon; (#E95420) is Ubuntu orange — change to any hex colour.
format = "[$symbol](#E95420) "

[os.symbols]
# Icons require a Nerd Font. Change the codepoints if your font differs.
Ubuntu = "󰕈"   # nf-md-ubuntu
Arch   = "󰣇"   # nf-md-arch
Macos  = ""    # nf-fa-apple

# =========================================================
# Directory module  — shows the current path
# =========================================================
[directory]
format = "[$path](cyan) "  # cyan colour; change to bold cyan, blue, etc.

# How many path components to show before truncating with "…"
truncation_length = 4

# When inside a git repo, truncate relative to the repo root (not $HOME).
# Example: shows "src/components/Button" instead of "~/projects/app/src/…"
truncate_to_repo = true

# =========================================================
# Git branch module
# =========================================================
[git_branch]
symbol = ""   # nf-dev-git_branch icon
format = "[$symbol $branch](purple) "

# =========================================================
# Git status module
# =========================================================
[git_status]
# Each variable is substituted with count (number of files in that state).
# Omit a line to hide that indicator entirely.
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](cyan)"    # commits ahead of remote
behind     = "[⇣$count ](cyan)"    # commits behind remote
diverged   = "[⇡$ahead_count⇣$behind_count ](cyan)"  # both ahead and behind
staged     = "[+$count ](green)"   # files staged (git add)
modified   = "[●$count ](yellow)"  # tracked files with unstaged changes
untracked  = "[?$count ](white)"   # new files not yet tracked
deleted    = "[✘$count ](red)"     # deleted files
conflicted = "[⚡$count ](red)"    # merge conflicts

# =========================================================
# Language version modules
# Each only appears when the relevant project file is detected
# (package.json, Cargo.toml, go.mod, composer.json, etc.)
# =========================================================

[nodejs]
symbol = ""   # nf-dev-nodejs_small
format = "[$symbol $version](green) "

[rust]
symbol = ""   # nf-dev-rust
format = "[$symbol $version](red) "

[golang]
symbol = ""   # nf-dev-go
format = "[$symbol $version](cyan) "

[php]
symbol = ""   # nf-dev-php
format = "[$symbol $version](purple) "

# =========================================================
# Character module  — the prompt symbol at the end of the line
# =========================================================
[character]
success_symbol = "[❯](green)"   # green ❯ when last command succeeded (exit 0)
error_symbol   = "[❯](red)"     # red   ❯ when last command failed   (exit ≠ 0)
vimcmd_symbol  = "[❮](blue)"    # blue  ❮ when in vi Normal mode (zsh-vi-mode)
